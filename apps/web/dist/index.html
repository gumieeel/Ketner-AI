<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d11" />
    <meta
      name="description"
      content="Ketner AI — интеллектуальный диалоговый ассистент нового поколения: флагманские AI-модели в едином интерфейсе."
    />
    <link rel="preload" href="/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <title>Ketner AI</title>
    <script>
      // Отключаем автоматическое восстановление скролла браузером (Chrome/Safari/Firefox),
      // чтобы при открытии и перезагрузке страницы она всегда открывалась строго сверху.
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      if (!window.location.hash) {
        window.scrollTo(0, 0);
      }

      // Тема применяется до первой отрисовки, чтобы не было вспышки светлого фона.
      (function () {
        try {
          var stored = window.localStorage.getItem('ketner.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0d11' : '#f4f6f9');
        } catch (error) {
          /* localStorage может быть недоступен — остаётся тёмная тема по умолчанию */
        }
      })();

      window.addEventListener('beforeunload', function () {
        if (!window.location.hash) {
          window.scrollTo(0, 0);
        }
      });
      window.addEventListener('load', function () {
        if (!window.location.hash) {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        }
      });
    </script>
    <script type="module" crossorigin src="/assets/index-DytGZZtn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CcIvzJLo.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
