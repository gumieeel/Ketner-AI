    <script>
      // Отключаем автоматическое восстановление скролла браузером (Chrome/Safari/Firefox),
      // чтобы при открытии и перезагрузке страницы она всегда открывалась строго сверху.
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      if (!window.location.hash) {
        window.scrollTo(0, 0);
      }

      // Тема применяется до первой отрисовки, чтобы не было вспышки светлого фона.
      (function () {
        try {
          var stored = window.localStorage.getItem('ketner.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1c1b' : '#eceee9');
        } catch (error) {
          /* localStorage может быть недоступен — остаётся тёмная тема по умолчанию */
        }
      })();

      window.addEventListener('beforeunload', function () {
        if (!window.location.hash) {
          window.scrollTo(0, 0);
        }
      });
      window.addEventListener('load', function () {
        if (!window.location.hash) {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        }
      });
    </script>
