<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="Ketner AI — интеллектуальный диалоговый ассистент нового поколения: флагманские AI-модели в едином интерфейсе."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <title>Ketner AI</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было вспышки светлого фона.
      (function () {
        try {
          var stored = window.localStorage.getItem('ketner.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#09090b' : '#fafafa');
        } catch (error) {
          /* localStorage может быть недоступен — остаётся тёмная тема по умолчанию */
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-RCSepqlE.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index--bjq9FJL.css">
  </head>

    <div id="root"></div>
  </body>
</html>
