services:
  - type: web
    name: ketner-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Платформа решений (docs/ACCEPTANCE.md): включена по умолчанию; `false` в панели — откат.
      - key: DISCOVERY_ENABLED
        sync: false
      # Учебный помощник (шаблон-инструмент): выключен, пока его не одобрят; `true` в панели — включить.
      - key: STUDY_ASSISTANT_ENABLED
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: RUNWARE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SUPPORT_BOT_TOKEN
        sync: false
      - key: CRYPTOCLOUD_API_KEY
        sync: false
      - key: CRYPTOCLOUD_SHOP_ID
        sync: false
      - key: CRYPTOCLOUD_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPPORT_ADMIN_CHAT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: VIP_EMAILS
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
